<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Preorder Notification</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6;">
  
  <h2>🔔 PREORDER REQUEST</h2>

  <h3>👤 THÔNG TIN KHÁCH HÀNG</h3>
  <p><b>Tên:</b> {{userName}}</p>
  <p><b>Email:</b> {{userEmail}}</p>

  <h3>📦 THÔNG TIN SẢN PHẨM</h3>
  <p><b>Tên sản phẩm:</b> {{productName}}</p>

  <table border="1" cellpadding="8" cellspacing="0" width="100%">
    <thead>
      <tr>
        <th>SKU</th>
        <th>Màu sắc</th>
        <th>Size</th>
        <th>Giá</th>
        <th>Tồn kho</th>
      </tr>
    </thead>
    <tbody>
      {{{variantTable}}}
    </tbody>
  </table>

  <hr />
  <p style="font-size:12px;color:#666">
    Preorder được gửi lúc {{time}}
  </p>

</body>
</html>
